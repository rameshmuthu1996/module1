<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-light">
    <!-- -------------------Sign In------------------------ -->
    <div class="container">
        <div class="row mt-5">
            <div class="col-lg-4 col-md-4 col-12 bg-white m-auto border border-success rounded-4">
                <h2 class="text-center text-success pt-3">Sign In</h2>

                <!-- --------------------------form start---------------------  -->
                <form action="projects.html">
                    <div class="input-group mt-3">
                        <span class="input-group-text"><i class="fa-solid fa-square-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="Your Email" required>
                    </div>
                    <div class="input-group mt-3">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Your Password" required>
                    </div>

                    <div class="input-group mt-3 mb-3">
                        <button class=" form-control btn btn-success">SignIn Now</button>
                    </div>
                    <p class="text-center">Register Now for Free by clicking <a href="Sign Up.html"
                            class="text-success">SignUp Now</a>

                    </p>
                </form>
                <!-- -----------------------------form end -------------------------------- -->

            </div>

        </div>
    </div>


</body>

</html>
