<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="bg-light">
    <section class="container">
        <div class="row mt-5">
            <div class="col-lg-4 col-md-4 col-12 bg-white m-auto rounded-4 border border-success">
                <h2 class="text-center text-success pt-3 ">Signup Now</h2>
                <p class="text-center text-primary text-muted lead">It's Free and Takes a Minute</p>

                <!-- --------------------------form start------------------------ -->
                <form action="projects.html">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-user"></i></span>
                        <input type="text" class="form-control" placeholder="First Name" required>
                    </div>

                    <div class="input-group mt-3">
                        <span class="input-group-text"><i class="fa fa-user"></i></span>
                        <input type="text" class="form-control" placeholder="Last Name" required>
                    </div>
                    <div class="input-group mt-3">
                        <span class="input-group-text"><i class="fa-solid fa-square-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="Your Email" required>

                    </div>
                    <div class="input-group mt-3">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="input-group mt-3 mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Confirm Password" required>
                    </div>
                    <div class="d-grid">
                        <button type="button" class="btn btn-success form-control mb-2">Signup Now</button>
                        <p class="text-center text-muted">
                            When You Register by Clicking Signup Button, You Agree to our
                            <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>
                        </p>

                        <p class="text-center">
                            Already have an account ? <a href="signin.html">SignIn Here</a>
                        </p>
                    </div>

                </form>

            </div>
        </div>

    </section>


</body>

</html>
